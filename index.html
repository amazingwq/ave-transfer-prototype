<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ave 转账流程原型</title>
  <style>
    :root {
      --blue: #4f7df3;
      --blue-strong: #2f63ee;
      --bg: #eef2f8;
      --card: #ffffff;
      --text: #141824;
      --muted: #6b7280;
      --orange: #e68a00;
      --orange-bg: #fff7e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 10%, rgba(79, 125, 243, 0.16), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(79, 125, 243, 0.10), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    .badge {
      display: inline-flex;
      height: 28px;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -0.05em;
    }

    .desc {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .grid {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 18px 46px rgba(20, 32, 60, 0.11);
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 60px rgba(20, 32, 60, 0.16);
    }

    .tag {
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: #edf3ff;
      color: var(--blue-strong);
      font-size: 12px;
      font-weight: 950;
    }

    .tag.warn {
      background: var(--orange-bg);
      color: var(--orange);
    }

    h2 {
      margin: 20px 0 8px;
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .action {
      margin-top: auto;
      display: inline-flex;
      height: 46px;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
    }

    @media (max-width: 720px) {
      main { padding: 32px 0; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">AVE TRANSFER PROTOTYPE</span>
    <h1>Ave 转账流程交互原型</h1>
    <p class="desc">这里保留两个入口：全部成功流程和批量部分成功流程。进入页面后可在「转账 / 归集 / 分发」之间切换，点到底查看确认页和结果页。</p>

    <section class="grid" aria-label="原型入口">
      <a class="card" href="./designs/ave-transfer-success.html">
        <span class="tag">SUCCESS</span>
        <h2>全部成功流程</h2>
        <p>默认进入一对一转账；也可在页面内切换到一对多分发、多对一归集，最终均展示全部成功结果。</p>
        <span class="action">打开全部成功流程</span>
      </a>

      <a class="card" href="./designs/ave-transfer-partial.html">
        <span class="tag warn">PARTIAL SUCCESS</span>
        <h2>批量部分成功流程</h2>
        <p>默认进入一对多分发；也可切换到多对一归集，最终展示 2 成功 / 1 失败，并可查看地址结果。</p>
        <span class="action">打开部分成功流程</span>
      </a>
    </section>
  </main>
</body>
</html>
